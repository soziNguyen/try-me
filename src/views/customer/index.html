<%- include('../partials/header.html') %>
  <div class="container container-xl">
    <div class="cus-nav">
      <div class="header">
        <button id="btnViewOrder" class="btn btn-success me-1">Xem đơn</button>
        <button id="btnContactToStaff" class="btn btn-warning me-1">Gọi nhân viên</button>
      </div>
      <div class="cart-icon" id="cartIcon">
        <i class="bi bi-cart"></i>
        <span class="cart-quantity"></span>
      </div>
    </div>

    <div class="order order-card">
      <div class="row ">
        <div class="col-lg" id="foodMenuCol">
          <div class="search-form position-relative d-flex align-items-center mt-4 mb-3" id="search-menu">
            <i class="bi bi-search position-absolute end-0 translate-middle-x me-2 fs-5 opacity-50"></i>
            <input type="text" id="searchMenuInput" class="form-control" placeholder="Tìm kiếm" />
          </div>
          <h1 class="fw-bold fs-2">THỰC ĐƠN</h1>
          <div class="category-slider-wrapper">
            <div class="go-top-wrapper position-absolute start-50 top-100 z-1 translate-middle-x d-none">
              <div id="go-top">
                <i class="bi bi-arrow-up"></i>
              </div>
            </div>
            <div class="swiper categorySwiper">
              <div class="swiper-wrapper" id="categoryList">
              </div>
            </div>
            <div class="swiper-button-next"></div>
            <div class="swiper-button-prev"></div>
          </div>
          <div id="foodMenu" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xxl-4 g-3">
          </div>
        </div>
      </div>
    </div>
    <div
      class="viewCartBottomBtn fixed-bottom p-3 bg-white border-top d-md-none d-flex justify-content-between align-items-center">
      <h5 class="text-danger fw-semibold mb-0"><span id="cartTotalPrice">0</span> đ</h5>
      <button type="button" id="btnViewCart" class="btn btn-success">Xem giỏ hàng</button>
    </div>
    <div class="order-detail mt-5 d-none" id="orderDetail">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Chi tiết đơn hàng</h3>
        <button id="btnBackToMenu" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left"></i> Quay lại menu
        </button>
      </div>

      <div id="orderSummary" class="mb-3 border-bottom pb-3"></div>

      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Tên món</th>
              <th class="text-center">Số lượng</th>
              <th class="text-end">Đơn giá</th>
              <th class="text-end">Thành tiền</th>
            </tr>
          </thead>
          <tbody id="orderDetailBody"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between border-top pt-3">
        <h5 class="mb-0">Tổng cộng:</h5>
        <h4 class="text-danger fw-bold mb-0" id="orderDetailTotal">0 đ</h4>
      </div>
      <div class="text-center text-success mt-2">Lưu ý: Giá trên chưa bao gồm thuế VAT</div>
    </div>
  </div>

  <div id="cartModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Giỏ hàng</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pb-0" id="cartItemsList"></div>
        <div class="modal-footer d-block">
          <button type="button" id="btnSubmitOrder" class="btn btn-success w-100">Gửi đơn</button>
        </div>
      </div>
    </div>
  </div>

  <%- include('../partials/commonjs.html') %>
    <script src="/js/library/socket.io.min.js"></script>
    <script src="/js/sidebar-toggle.js"></script>
    <script src="/js/cart.js"></script>
    <%- include('../partials/footer.html') %>
