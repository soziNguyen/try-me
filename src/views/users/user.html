<%- include('../partials/header.html') %>
<%- include('../partials/admin_sidebar.html') %>
<div class="admin__content">
  <div class="container">
      <h3 class="fw-bold mb-4">STAFF MANAGEMENT</h3>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="btn-group">
          <button class="btn btn-outline-secondary me-2" id="deleteManyBtn">
            <i class="bi bi-trash me-1"></i> Delete
          </button>
          <button class="btn btn-outline-success" id="newUser">
            <i class="bi bi-person-plus me-1"></i> Add User
          </button>
        </div>
        <div class="search-form d-flex align-items-center" id="search-container">
          <input type="text" id="searchUserInput" class="form-control me-2" placeholder="Search" />
        </div>
      </div>

      <table id="userTable" class="table table-striped table-hover">
        <thead>
          <tr>
            <th class="t_center"><input type="checkbox" id="selectAll"></th>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Created At</th>
            <th>Updated At</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- data inserted here -->
        </tbody>
      </table>
      <!--new user modal-->

      <div class="modal fade" id="newUserModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Create New User</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="newUserForm">
                <div class="mb-3">
                  <label>Username:</label>
                  <input type="text" id="username" class="form-control">
                </div>
                <div class="mb-3">
                  <label>Email:</label>
                  <input type="email" id="email" class="form-control" autocomplete="username">
                </div>
                <div class="mb-3">
                  <label>Password:</label>
                  <input type="password" id="password" class="form-control" autocomplete="new-password">
                </div>
                <div class="mb-3">
                  <label>Confirm Password:</label>
                  <input type="password" id="confirm-password" class="form-control" autocomplete="new-password">
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
                <i class="bi bi-x-lg"></i> Close
              </button>
              <button id="createUserBtn" class="btn btn-outline-primary">
                <i class="bi bi-person-plus me-1"></i> Create
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- update user modal -->

      <div class="modal fade" id="updateUserModal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h4 class="modal-title">Update - <%= user.username %></h4>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <form id="updateUserForm">
                <div class="mb-3">
                  <label>Username:</label>
                  <input type="text" id="new-username" class="form-control">
                </div>
                <div class="mb-3">
                  <label>Email:</label>
                  <input type="email" id="new-email" class="form-control" autocomplete="username">
                </div>
                <div class="mb-3">
                  <label>New Password:</label>
                  <input type="password" id="new-password" class="form-control" autocomplete="new-password">
                </div>
                <div class="mb-3">
                  <label>Confirm Password:</label>
                  <input type="password" id="new-confirm-password" class="form-control" autocomplete="new-password">
                </div>
                <div class="mb-3">
                  <label>Role:</label>
                  <select id="new-role" class="form-control">
                  </select>
                </div>
              </form>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
                <i class="bi bi-x-lg"></i> Close
              </button>
              <button id="updateUserBtnForm" class="btn btn-outline-primary">
                <i class="bi bi-pencil-square me-1"></i> Update
              </button>
            </div>
          </div>
        </div>
      </div>
  </div>
</div>
</div>
</div>

  <input type="hidden" id="currentUserId" value="<%= currentUserId %>">
  <%- include('../partials/commonjs.html')%>
  <script src="/js/users.js"></script>
  <script src="/js/update-user.js"></script>
  <script src="/js/sidebar-toggle.js"></script>
  <%- include('../partials/footer.html') %>
