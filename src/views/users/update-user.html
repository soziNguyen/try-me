<div class="modal fade" id="updateUserModal1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update - <%= user.username %></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="updateUserForm1">
            <div class="mb-3">
              <label>Username:</label>
              <input type="text" id="new-username-1" class="form-control">
            </div>
            <div class="mb-3">
              <label>Email:</label>
              <input type="email" id="new-email-1" class="form-control" autocomplete="username">
            </div>
            <div class="mb-3">
              <label>New Password:</label>
              <input type="password" id="new-password-1" class="form-control" autocomplete="new-password">
            </div>
            <div class="mb-3">
              <label>Confirm Password:</label>
              <input type="password" id="new-confirm-password-1" class="form-control" autocomplete="new-password">
            </div>
            <div class="mb-3 role">
              <label>Role:</label>
              <select id="new-role-1" class="form-control">
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-danger" data-bs-dismiss="modal">
            <i class="bi bi-x-lg"></i> Close
          </button>
          <button id="updateUserBtnForm1" class="btn btn-outline-primary">
            <i class="bi bi-pencil-square me-1"></i> Update
          </button>
        </div>
      </div>
    </div>
  </div>
