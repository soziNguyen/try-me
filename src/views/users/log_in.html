<%- include('../partials/header.html') %>

  <div class="bg-white d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow w-100 mw-400">
      <div class="card-header text-center bg-white">
        <h2 class="mb-0 fw-bold pt-1 pb-1 t_purple">ĐĂNG NHẬP</h2>
      </div>
      <div class="card-body p-md-4">
        <form id="login-form">
          <div class="mb-3">
            <input type="text" class="form-control" id="login" name="login" placeholder="Username"
              autocomplete="username" />
          </div>

          <div class="mb-3">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password"
              autocomplete="current-password" />
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" value="1" />
              <label class="form-check-label" for="remember">Nhớ mật khẩu</label>
            </div>
            <a href="/login/identify" class="text-decoration-none">Quên mật khẩu?</a>
          </div>

          <button type="submit" class="btn bg-purple text-white w-100">Đăng nhập</button>

          <p class="text-center mt-3 mb-0">
            Chưa có tài khoản?
            <a href="/signup" class="text-decoration-none">Đăng ký</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <%- include('../partials/commonjs.html') %>
    <script src="/js/users.js"></script>
    <%- include('../partials/footer.html') %>
