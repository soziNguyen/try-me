<%- include('../partials/header.html') %>    

<div class="container bg-white">
  <div class="row mt-md-5">
    <div class="col-md-6 mx-auto">
      <div class="card shadow-sm">
        <div class="card-header text-center bg-white">
          <h4 class="mb-0 fw-bold">Đăng ký tổ chức và quản trị viên</h4>
        </div>
        <div class="card-body">
          <form id="signup-form">
            <!-- Organization Info -->
            <div class="mb-4">
              <h6 class="fw-bold text-secondary mb-3">Thông tin hồ sơ <span class="text-danger">*</h6>
              <div class="mb-3">
                <input type="text" name="orgName" id="orgName" class="form-control" placeholder="Tên tổ chức">
              </div>
              <div class="mb-3">
                <input type="email" name="orgEmail" id="orgEmail" class="form-control" placeholder="Email">
              </div>
              <div class="mb-3">
                <input type="text" name="orgPhone" id="orgPhone" class="form-control" placeholder="Số điện thoại">
              </div>
              <div class="mb-3">
                <select name="orgProvince" id="orgProvince" class="form-select">
                </select>
              </div>
              <div class="mb-3">
                <select name="orgCommune" id="orgCommune" class="form-select">
                </select>
              </div>
              <div class="mb-3">
                <input type="text" name="orgStreet" id="orgStreet" class="form-control" placeholder="Số nhà/Đường">
              </div>
            </div>

            <!-- Admin Info -->
            <div class="mb-4">
              <h6 class="fw-bold text-secondary mb-3">Thông tin đăng nhập <span class="text-danger">*</h6>
              <div class="mb-3">
                <input type="text" name="adminUsername" id="adminUsername" class="form-control" placeholder="Tài khoản">
              </div>
              <div class="mb-3">
                <input type="email" name="adminEmail" id="adminEmail" class="form-control" placeholder="Email">
              </div>
              <div class="mb-3">
                <input type="password" name="adminPassword" id="adminPassword" class="form-control" placeholder="Mật khẩu" autocomplete="">
              </div>
              <div class="mb-3">
                <input type="password" name="confirmPassword" id="confirmPassword" class="form-control" placeholder="Xác nhận mật khẩu" autocomplete="">
              </div>
            </div>

            <button type="submit" class="btn btn-success w-100">
              <i class="bi bi-plus-circle me-2"></i>Tạo tổ chức và quản trị viên
            </button>
          </form>
        </div>
        <div class="card-footer text-center bg-white">
          Đã có tài khoản? <a href="/login">Đăng nhập</a>
        </div>
      </div>
    </div>
  </div>
</div>

<%- include('../partials/commonjs.html') %>    
<script src = "/js/users.js"></script>
<%- include('../partials/footer.html') %>    

</html>
