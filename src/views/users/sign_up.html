<%- include('../partials/header.html') %>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-xl-10 col-lg-11">

        <!-- Header -->
        <div class="card shadow border rounded-4 mb-4">
          <div class="card-header text-center py-4 bg-light border-0">
            <h4 class="mb-0 fw-semibold text-dark">Đăng ký tổ chức và quản trị viên</h4>
            <p class="text-muted small mb-0 mt-2">Điền đầy đủ thông tin để đăng ký</p>
          </div>
        </div>

        <!-- Form -->
        <form id="signup-form">
          <div class="row g-4">

            <!-- Thông tin tổ chức -->
            <div class="col-lg-6 d-flex">
              <div class="card shadow-sm rounded-4 p-4 flex-fill">
                <h5 class="fw-bold border-bottom pb-2 mb-4">
                  <i class="bi bi-building me-2"></i>Thông tin hồ sơ
                </h5>

                <div class="mb-3">
                  <label for="taxCode" class="form-label text-secondary fw-semibold">Mã số thuế</label>
                  <input type="text" id="taxCode" name="taxCode" class="form-control rounded-3"
                    placeholder="Nhập mã số thuế">
                </div>

                <div class="mb-3">
                  <label for="orgName" class="form-label text-secondary fw-semibold">Tên tổ chức *</label>
                  <input type="text" id="orgName" name="orgName" class="form-control rounded-3"
                    placeholder="Nhập tên tổ chức" required>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label for="orgEmail" class="form-label text-secondary fw-semibold">Email *</label>
                    <input type="email" id="orgEmail" name="orgEmail" class="form-control rounded-3"
                      placeholder="email@domain.com" required>
                  </div>
                  <div class="col-md-6">
                    <label for="orgPhone" class="form-label text-secondary fw-semibold">Số điện thoại *</label>
                    <input type="text" id="orgPhone" name="orgPhone" class="form-control rounded-3"
                      placeholder="0123456789" required>
                  </div>
                </div>

                <div class="row">
                  <div class="mb-3 col-md-6">
                    <label for="orgProvince" class="form-label text-secondary fw-semibold">Tỉnh/Thành phố *</label>
                    <select id="orgProvince" name="orgProvince" class="form-select rounded-3"></select>
                  </div>

                  <div class="mb-3 col-md-6">
                    <label for="orgCommune" class="form-label text-secondary fw-semibold">Xã/Phường *</label>
                    <select id="orgCommune" name="orgCommune" class="form-select rounded-3"></select>
                  </div>
                </div>

                <div class="mb-3">
                  <label for="orgStreet" class="form-label text-secondary fw-semibold">Địa chỉ chi tiết</label>
                  <input type="text" id="orgStreet" name="orgStreet" class="form-control rounded-3"
                    placeholder="Số nhà, tên đường">
                </div>
              </div>
            </div>

            <!-- Thông tin quản trị viên -->
            <div class="col-lg-6 d-flex flex-column">
              <div class="card shadow-sm rounded-4 p-4 flex-fill d-flex flex-column">
                <div class="flex-grow-1">
                  <h5 class="fw-bold border-bottom pb-2 mb-4">
                    <i class="bi bi-person-circle me-2"></i>Thông tin đăng nhập
                  </h5>

                  <div class="mb-3">
                    <label for="adminUsername" class="form-label text-secondary fw-semibold">Tài khoản *</label>
                    <input type="text" id="adminUsername" name="adminUsername" class="form-control rounded-3"
                      placeholder="Nhập tên tài khoản" required>
                  </div>

                  <div class="mb-3">
                    <label for="adminEmail" class="form-label text-secondary fw-semibold">Email đăng nhập *</label>
                    <input type="email" id="adminEmail" name="adminEmail" class="form-control rounded-3"
                      placeholder="admin@email.com" required>
                  </div>

                  <div class="row g-3 mb-3">
                    <div class="col-md-6">
                      <label for="adminPassword" class="form-label text-secondary fw-semibold">Mật khẩu *</label>
                      <input type="password" id="adminPassword" name="adminPassword" class="form-control rounded-3"
                        placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                      <label for="confirmPassword" class="form-label text-secondary fw-semibold">Xác nhận *</label>
                      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control rounded-3"
                        placeholder="••••••••" required>
                    </div>
                    <div class="col-md-12">
                      <label for="accountType" class="form-label text-secondary fw-semibold">Loại hình kinh doanh
                        *</label>
                      <select id="accountType" name="accountType" class="form-select rounded-3"></select>
                    </div>
                  </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 rounded-pill mt-3">
                  Tạo tổ chức và quản trị viên
                </button>
              </div>
            </div>

          </div>
        </form>

        <!-- Footer -->
        <div class="text-center mt-5">
          <p class="mb-0">Đã có tài khoản?
            <a href="/login" class="text-primary fst-italic text-decoration-none">Đăng nhập ngay</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <%- include('../partials/commonjs.html') %>
    <script src="/js/users.js"></script>
    <%- include('../partials/footer.html') %>
