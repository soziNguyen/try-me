<!-- Overlay -->
<div id="staffCallOverlay" class="d-none position-fixed top-0 start-0 w-100 h-100"></div>

<!-- Centered Bell Modal -->
<div id="staffCallBell" class="d-none w-400 position-fixed top-50 start-50 translate-middle"
    >
  
  <div class="bg-white rounded-4 shadow-lg p-4 text-center">
    <h5 id="staffTitle" class="mb-5 fw-bold text-danger">Khách gửi yêu cầu cần hỗ trợ!</h5>

    <img src="/assets/images/christmas-bell-2.png"
         id="staffCallBellIcon">

    <audio id="staffCallBellSound" src="/assets/sounds/noti.wav" loop></audio>

    <button id="staffCallBellAcknowledge" 
            class="btn btn-success btn-lg w-100 mt-5">
      Xác nhận
    </button>
  </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmModalTitle">Xác nhận</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="confirmModalBody">
        Bạn có chắc chắn muốn thực hiện thao tác này?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-light text-primary border-primary rounded-pill px-4"
          data-bs-dismiss="modal">Hủy</button>
        <button type="button" id="confirmModalOk">Xác nhận</button>
      </div>
    </div>
  </div>
</div>

</body>
</html>
