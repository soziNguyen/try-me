<div class="modal fade" id="imageCropModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content image-crop-modal">
      <div class="modal-header">
        <h5 class="modal-title">Cắt ảnh</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>
      </div>
      <div class="modal-body d-flex justify-content-center align-items-center">
        <input type="file" id="imageInput" accept="image/*" class="d-none" />
        <img
          id="imagePreview"
          class="img-fluid preview-crop-image"
          alt="Ảnh xem trước"
        />
      </div>
      <div class="modal-footer">
        <button id="cropBtn" class="btn btn-primary">Lưu</button>
      </div>
    </div>
  </div>
</div>
