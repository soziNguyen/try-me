<%- include('../partials/header.html') %>

<div class="container container-xxl">
  <div class="row justify-content-center mt-md-3">
    <div class="col-12 col-xl-10">
      <div class="card shadow">
        <!-- Header -->
        <div class="card-header bg-primary text-white text-center py-4">
          <h1 class="card-title mb-2">
            <i class="bi bi-arrow-left-right me-2"></i>PHIẾU CHUYỂN KHO
          </h1>
          <p class="mb-0">Quản lý chuyển kho nguyên liệu</p>
        </div>

        <!-- Form Content -->
        <div class="card-body p-4">
          <form id="stockTransferForm">
            <!-- Thông tin chung -->
            <div class="mb-4">
              <h5 class="text-primary border-bottom pb-2 mb-3">
                <i class="bi bi-info-circle me-2"></i>Thông tin chung
              </h5>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="code" class="form-label">Mã phiếu</label>
                  <input type="text" class="form-control" id="code" name="code" placeholder="Mã phiếu..." readonly>
                </div>
                <div class="col-md-6">
                  <label for="date" class="form-label">Ngày chuyển</label>
                  <input type="text" class="form-control" id="date" name="date" placeholder="dd/mm/yyyy" readonly>
                </div>
                <div class="col-md-6">
                  <label for="createdBy" class="form-label">Người tạo</label>
                  <input type="text" class="form-control" id="createdBy" readonly>
                </div>

              </div>
            </div>

            <!-- Danh sách nguyên liệu -->
            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="text-primary mb-0">
                  <i class="bi bi-list-ul me-2"></i>Danh sách nguyên liệu
                </h5>
                <button type="button" class="btn btn-success btn-sm no-print" id="addItemBtn">
                  <i class="bi bi-plus-circle me-1"></i>Thêm nguyên liệu
                </button>
              </div>

              <div class="table-responsive">
                <table class="table table-bordered">
                  <thead class="table-primary">
                    <tr>
                      <th width="35%">Nguyên liệu</th>
                      <th width="25%">Kho nguồn</th>
                      <th width="20%">Kho đích</th>
                      <th width="15%">Số lượng</th>
                      <th width="5%" class="no-print">Xóa</th>
                    </tr>
                  </thead>
                  <tbody id="itemsTableBody">
                    
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Ghi chú -->
            <div class="mb-4">
              <label for="note" class="form-label">Ghi chú</label>
              <textarea class="form-control" id="note" name="note" rows="3" placeholder="Nhập ghi chú..."></textarea>
            </div>

            <!-- Buttons -->
            <div class="d-flex gap-2 justify-content-between">
              <button type="button" id="btn-lock-transfer" class="btn btn-outline-primary no-print">
                <i class="bi bi-lock me-2"></i>Xác nhận
              </button>
              <div class="d-flex justify-content-end">
                <a href="/inventory/stock-transfers" id="btn-back" class="btn btn-outline-secondary me-2 no-print">
                  <i class="bi bi-x-circle me-2 no-print"></i>Quay lại
                </a>
                <button type="button" id="btn-print" class="btn btn-outline-info me-2 no-print">
                  <i class="bi bi-printer me-2"></i>In phiếu
                </button>
                <button type="submit" id="btn-save-transfer" class="btn btn-primary no-print">
                  <i class="bi bi-check-circle me-2"></i>Lưu phiếu
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<%- include('../partials/commonjs.html') %>
<script src="/js/data-table.js"></script>
<script src="/js/stock-transaction/stock-transfer-detail.js"></script>
<%- include('../partials/footer.html') %>
