<%- include('../partials/header.html') %>
  <%- include('../partials/org_sidebar.html') %>

    <div class="admin__content">
      <h2 class="mb-3 bold semi-bold">
        <%= pageTitle %>
      </h2>

      <div class="row g-3 mb-3">
        <!-- Date Filter Card -->
        <div class="col-12 col-lg-4">
          <div class="card border-0 shadow-sm h-100 bg-info bg-gradient d-flex flex-column">
            <div class="card-body p-3 d-flex flex-column">
              <div class="d-flex align-items-center mb-3">
                <i class="bi bi-calendar-range fs-5 me-2"></i>
                <h6 class="mb-0 fw-semibold">Bộ lọc ngày</h6>
              </div>

              <div id="dateFilter" class="dropdown mt-auto">
                <button id="toggleFilterBtn" class="btn btn-light w-100 dropdown-toggle" type="button"
                  data-bs-toggle="dropdown" aria-expanded="false">
                  <i class="bi bi-calendar3 me-2"></i> Chọn ngày lọc
                </button>

                <div id="filetdate" class="dropdown-menu p-3 shadow border-0 w-100">
                  <div class="row g-2">
                    <div class="col-12">
                      <label for="startDate" class="form-label small text-dark mb-1">Từ ngày</label>
                      <input type="date" id="startDate" class="form-control form-control-sm" />
                    </div>
                    <div class="col-12">
                      <label for="endDate" class="form-label small text-dark mb-1">Đến ngày</label>
                      <input type="date" id="endDate" class="form-control form-control-sm" />
                    </div>
                    <div class="col-12">
                      <button id="filterDateBtn" class="btn btn-primary w-100 btn-sm" title="Lọc">
                        <i class="bi bi-funnel-fill me-1"></i> Áp dụng
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Total Orders Card -->
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card border-0 shadow-sm h-100 bg-primary bg-gradient text-center p-3">
            <div class="d-flex align-items-center justify-content-center mb-2">
              <i class="bi bi-receipt-cutoff fs-5 me-2"></i>
              <h6 class="mb-0 fw-semibold">Tổng đơn hàng</h6>
            </div>
            <div class="fs-2 fw-bold" id="summary-total-orders">0</div>
            <small class="opacity-75">Đơn hàng</small>
          </div>
        </div>

        <!-- Total Amount Card -->
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card border-0 shadow-sm h-100 bg-success bg-gradient text-center p-3">
            <div class="d-flex align-items-center justify-content-center mb-2">
              <i class="bi bi-cash-stack fs-5 me-2"></i>
              <h6 class="mb-0 fw-semibold">Tổng doanh thu</h6>
            </div>
            <div class="fs-2 fw-bold"><span id="summary-total-amount">0</span> đ</div>
            <small class="opacity-75">Doanh thu</small>
          </div>
        </div>
      </div>

      <table id="receiptTable" class="table table-bordered">
        <tbody id="receiptTableBody"></tbody>
      </table>

      <div class="mt-3">
        <button id="printBtn" class="btn btn-outline-secondary"><i class="bi bi-printer"></i> In báo cáo</button>
      </div>
    </div>

    <input type="hidden" id="currentUserId" value="<%= currentUserId %>">

    <%- include('../partials/commonjs.html') %>
      <script src="/js/payment-receipts.js"></script>
      <script src="/js/sidebar-toggle.js"></script>
      <%- include('../partials/footer.html') %>
