<%- include('../partials/header.html') %>

  <div class="container container-xxl">
    <div class="row justify-content-center mt-md-3">
      <div class="col-12 col-xl-10">
        <div class="card shadow">
          <!-- Header -->
          <div class="card-header bg-primary text-white text-center py-4">
            <h1 class="card-title mb-2">
              <i class="bi bi-cash-stack me-2"></i>PHIẾU CHI
            </h1>
            <p class="mb-0">Quản lý chi tiêu phát sinh</p>
          </div>

          <!-- Form Content -->
          <div class="card-body p-4">
            <form id="paymentExpensesForm">
              <!-- Thông tin chung -->
              <div class="mb-4">
                <h5 class="text-primary border-bottom pb-2 mb-3">
                  <i class="bi bi-info-circle me-2"></i>Thông tin chung
                </h5>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="code" class="form-label">Mã phiếu</label>
                    <input type="text" class="form-control" id="code" name="code" placeholder="Mã phiếu..." readonly>
                  </div>
                  <div class="col-md-6">
                    <label for="date" class="form-label">Ngày chi</label>
                    <input type="text" class="form-control" id="date" name="date" placeholder="dd/mm/yyyy" readonly>
                  </div>
                  <div class="col-md-6">
                    <label for="warehouse" class="form-label">Kho chi <span class="text-danger">*</span></label>
                    <input type="text" id="warehouse" name="warehouse" class="form-control" readonly>
                  </div>
                  <div class="col-md-6">
                    <label for="createdBy" class="form-label">Người tạo</label>
                    <input type="text" class="form-control" id="createdBy" readonly>
                  </div>
                  <div>
                    <label for="reason" class="form-label">Lý do</label>
                    <textarea class="form-control" id="reason" name="reason" placeholder="Lý do chi..."></textarea>
                  </div>
                </div>
              </div>

              <!-- Danh sách sản phẩm -->
              <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h5 class="text-primary mb-0">
                    <i class="bi bi-list-ul me-2"></i>Danh sách sản phẩm chi
                  </h5>
                  <button type="button" class="btn btn-success btn-sm no-print" id="addExpenseItemBtn">
                    <i class="bi bi-plus-circle me-1"></i>Thêm sản phẩm
                  </button>
                </div>

                <div class="table-responsive">
                  <table class="table table-bordered" id="expenses-detail-table">
                    <thead class="table-primary">
                      <tr>
                        <th>Tên Sản phẩm</th>
                        <th>Giá tiền</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                        <th class="no-print">Xóa</th>
                      </tr>
                    </thead>
                    <tbody id="expenseItemsBody"></tbody>
                  </table>
                </div>

                <!-- Tổng tiền -->
                <div class="row mt-3">
                  <div class="col-md-8"></div>
                  <div class="col-md-4">
                    <div class="card bg-light">
                      <div class="card-body p-3">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                          <strong>Tổng cộng:</strong>
                          <span id="totalExpenseAmount">0</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Ghi chú -->
              <div class="mb-4">
                <label for="note" class="form-label">Ghi chú</label>
                <textarea class="form-control" id="note" name="note" rows="3" placeholder="Nhập ghi chú..."></textarea>
              </div>

              <!-- Buttons -->
              <div class="d-flex gap-2 justify-content-end">
                <div class="d-flex justify-content-end">
                  <button id="btn-back" class="btn btn-outline-secondary me-2 no-print">
                    <i class="bi bi-x-circle me-2 no-print"></i>Quay lại
                  </button>
                  <button type="button" id="btn-print" class="btn btn-outline-info me-2 no-print">
                    <i class="bi bi-printer me-2 no-print"></i>In phiếu
                  </button>
                  <button type="submit" id="btn-save-expense" class="btn btn-primary no-print">
                    <i class="bi bi-check-circle me-2 no-print"></i>Lưu phiếu
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <%- include('../partials/commonjs.html') %>
    <script src="/js/data-table.js"></script>

    <input type="hidden" id="currentOrgId"
      value="<%= userRole === 'Admin' ? (session.currentOrg || '') : (currentOrgId || '') %>">
    <input type="hidden" id="paymentExpenseId" value="<%= paymentExpenseId %>">

    <script src="/js/payment-expenses-detail.js"></script>
    <%- include('../partials/footer.html') %>
