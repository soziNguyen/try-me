<%- include('../partials/header.html') %>
  <%- include('../partials/org_sidebar.html') %>

    <div class="admin__content">
      <h2 class="mb-4 fw-bold text-dark">
        <%= pageTitle %>
      </h2>

      <div class="report-header mb-4 p-4 border-0 rounded-4 bg-white shadow">

        <!-- Bộ lọc ngày -->
        <div class="filter-bar bg-primary bg-opacity-10 border border-primary rounded-4 p-4 mb-4 shadow-lg">
          <div class="row g-4 align-items-end justify-content-center">

            <div class="col-auto">
              <label class="form-label text-primary fw-bold mb-1 small">
                <i class="bi bi-bar-chart me-1"></i>Kiểu lọc
              </label>
              <select id="reportType" class="form-select form-select-lg border-primary rounded-3">
                <option value="month" selected>Theo tháng</option>
                <option value="quarter">Theo quý</option>
                <option value="custom">Tùy chọn ngày</option>
                <option value="all">Tất cả</option>
              </select>
            </div>

            <!-- Chọn quý -->
            <div class="col-auto" id="quarterGroup" style="display:none;">
              <label class="form-label text-primary fw-bold mb-1 small">
                <i class="bi bi-calendar3 me-1"></i>Chọn quý
              </label>
              <select id="quarterSelect" class="form-select form-select-lg border-primary rounded-3">
                <option value="1">Quý 1</option>
                <option value="2">Quý 2</option>
                <option value="3">Quý 3</option>
                <option value="4">Quý 4</option>
              </select>
            </div>

            <!-- Chọn tháng -->
            <div class="col-auto" id="monthGroup" style="display:none;">
              <label class="form-label text-primary fw-bold mb-1 small">
                <i class="bi bi-calendar-month me-1"></i>Chọn tháng
              </label>
              <select id="monthSelect" class="form-select form-select-lg border-primary rounded-3">
                <option value="1">Tháng 1</option>
                <option value="2">Tháng 2</option>
                <option value="3">Tháng 3</option>
                <option value="4">Tháng 4</option>
                <option value="5">Tháng 5</option>
                <option value="6">Tháng 6</option>
                <option value="7">Tháng 7</option>
                <option value="8">Tháng 8</option>
                <option value="9">Tháng 9</option>
                <option value="10">Tháng 10</option>
                <option value="11">Tháng 11</option>
                <option value="12">Tháng 12</option>
              </select>
            </div>

            <!-- Từ ngày -->
            <div class="col-auto">
              <label class="form-label text-primary fw-bold mb-1 small">
                <i class="bi bi-calendar-event me-1"></i>Từ ngày
              </label>
              <input type="date" id="startDate" class="form-control form-control-lg border-primary rounded-3">
            </div>

            <!-- Mũi tên -->
            <div class="col-auto d-flex align-items-center text-primary fs-4">
              <i class="bi bi-arrow-right"></i>
            </div>

            <!-- Đến ngày -->
            <div class="col-auto">
              <label class="form-label text-primary fw-bold mb-1 small">
                <i class="bi bi-calendar-check me-1"></i>Đến ngày
              </label>
              <input type="date" id="endDate" class="form-control form-control-lg border-primary rounded-3">
            </div>

            <!-- Nút Lọc -->
            <div class="col-auto">
              <button id="filterDateBtn" class="btn btn-primary btn-lg shadow px-4 py-2">
                <i class="bi bi-funnel me-2 fs-5"></i>Lọc
              </button>
            </div>

            <div class="col-auto">
              <label for="warehouseFilter" class="form-label fw-semibold mb-2 ">
                <i class="bi bi-building text-primary me-2"></i>
                Kho
              </label>
              <select id="warehouseFilter" class="form-select form-select-lg border-primary">
                <option value="all">Tất cả kho</option>
              </select>
            </div>
          </div>
        </div>


        <!-- Summary Cards -->
        <div class="row g-4 mb-5" id="summaryCards">
          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow h-100">
              <div class="card-body text-center p-4 bg-success bg-opacity-10 rounded">
                <div class="mb-3">
                  <div class="rounded-circle bg-success d-inline-flex align-items-center justify-content-center icon">
                    <i class="bi bi-currency-dollar text-white fs-1"></i>
                  </div>
                </div>
                <div class="fw-bold text-success mb-2">Tổng doanh thu</div>
                <div id="summary-total-revenue" class="display-6 fw-bold text-success">0₫</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow h-100">
              <div class="card-body text-center p-4 bg-primary bg-opacity-10 rounded">
                <div class="mb-3">
                  <div class="rounded-circle bg-primary d-inline-flex align-items-center justify-content-center icon">
                    <i class="bi bi-receipt text-white fs-1"></i>
                  </div>
                </div>
                <div class="fw-bold text-primary mb-2">Tổng đơn hàng</div>
                <div id="summary-total-orders" class="display-6 fw-bold text-primary">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow h-100">
              <div class="card-body text-center p-4 bg-warning bg-opacity-10 rounded">
                <div class="mb-3">
                  <div class="rounded-circle bg-warning d-inline-flex align-items-center justify-content-center icon">
                    <i class="bi bi-basket text-white fs-1"></i>
                  </div>
                </div>
                <div class="fw-bold text-warning mb-2">Tổng món đã bán</div>
                <div id="summary-total-items" class="display-6 fw-bold text-warning">0</div>
              </div>
            </div>
          </div>

          <div class="col-12 col-sm-6 col-lg-3">
            <div class="card border-0 shadow h-100">
              <div class="card-body text-center p-4 bg-info bg-opacity-10 rounded">
                <div class="mb-3">
                  <div class="rounded-circle bg-info d-inline-flex align-items-center justify-content-center icon">
                    <i class="bi bi-box-seam text-white fs-1"></i>
                  </div>
                </div>
                <div class="fw-bold text-info mb-2">Tổng combo đã bán</div>
                <div id="summary-total-combos" class="display-6 fw-bold text-info">0</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Sales Report -->
        <div class="sales-report mt-5">
          <h4 class="mb-4 fw-bold text-dark">
            <i class="bi bi-graph-up-arrow text-primary me-2"></i>
            Quản lý bán hàng
          </h4>
          <table id="sales-dataTable" class="table table-bordered">
            <thead>

            </thead>
            <tbody id="sales-data">

            </tbody>
          </table>
        </div>

      </div>
    </div>

    <input type="hidden" id="currentUserId" value="<%= currentUserId %>">
    <%- include('../partials/commonjs.html') %>
      <script src="/js/sidebar-toggle.js"></script>
      <script src="/js/sale.js"></script>
      <script src="/js/data-table.js"></script>
      <%- include('../partials/footer.html') %>
